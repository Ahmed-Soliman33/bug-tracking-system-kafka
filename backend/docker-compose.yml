# Bug Tracking System — Docker Compose
# All services run here; no local JDK or Maven required.

services:

  mysql:
    image: mysql:8
    container_name: bugtrackerKafka-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "9085:9080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  discovery-service:
    build: ./Discovery-Service
    container_name: discovery-service-kafka
    ports:
      - "9761:9761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9761/eureka/apps"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  api-gateway:
    build: ./API-GateWay
    container_name: api-gateway-kafka
    ports:
      - "9080:9080"
    depends_on:
      discovery-service:
        condition: service_healthy

  user-auth-service:
    build: ./User-Auth-Service
    container_name: user-auth-service-kafka
    ports:
      - "9081:9081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  bug-service:
    build: ./Bug-Service
    container_name: bug-service-kafka
    ports:
      - "9082:9082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  project-service:
    build: ./Project-Service
    container_name: project-service-kafka
    ports:
      - "9083:9083"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  notification-service:
    build: ./Notification-Service
    container_name: notification-service-kafka
    ports:
      - "9084:9084"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

volumes:
  mysql_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
